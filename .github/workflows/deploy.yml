name: Deploy to AWS

# Manual for now: the site is on GitHub Pages (pages.yml) until the AWS stack is
# deployed. Then fill in the env values below and add the push trigger back:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  id-token: write # lets the job ask GitHub for an OIDC token to trade for AWS credentials
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

# Not secrets: filled from `cdk deploy` outputs (infra/README.md).
env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: __DEPLOY_ROLE_ARN__
  SITE_BUCKET: __SITE_BUCKET__
  DISTRIBUTION_ID: __DISTRIBUTION_ID__

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets never change, so cache them for a year; HTML is always revalidated.
      - name: Upload
        run: |
          aws s3 sync dist/assets "s3://$SITE_BUCKET/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$SITE_BUCKET" --delete --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/"
